<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบให้คะแนนประกวดชุดปีใหม่ 2025</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        /* เพื่อให้ Dropdown แสดงอย่างถูกต้องบน iOS/Mobile */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%233b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>');
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1.5em;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-400 via-blue-500 to-blue-600 min-h-screen p-4">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-2xl shadow-2xl p-6 mb-6 text-center">
            <h1 class="text-4xl font-bold text-blue-600 mb-2">
                🎭 ประกวดชุดปีใหม่ 2025 🎭
            </h1>
            <p class="text-gray-600 mb-2">ให้คะแนนผู้เข้าประกวดแต่ละคนใน 4 หัวข้อ (1-5 คะแนน)</p>
            <div class="bg-blue-50 border-2 border-blue-200 rounded-lg p-3 mt-4">
                <p class="font-semibold text-blue-800 mb-2">เกณฑ์การให้คะแนน:</p>
                <div class="grid grid-cols-5 gap-2 text-sm text-center">
                    <div class="bg-red-100 rounded p-2">⭐ 1 = น้อยที่สุด</div>
                    <div class="bg-orange-100 rounded p-2">⭐⭐ 2 = น้อย</div>
                    <div class="bg-yellow-100 rounded p-2">⭐⭐⭐ 3 = ปานกลาง</div>
                    <div class="bg-lime-100 rounded p-2">⭐⭐⭐⭐ 4 = ดี</div>
                    <div class="bg-green-100 rounded p-2">⭐⭐⭐⭐⭐ 5 = ดีเยี่ยม</div>
                </div>
            </div>
        </div>

        <div id="votingForm" class="bg-white rounded-2xl shadow-2xl p-6">
            <div class="mb-6 pb-6 border-b-2 border-gray-200">
                <label class="block text-lg font-semibold text-gray-700 mb-2">
                    ชื่อผู้ให้คะแนน *
                </label>
                <input
                    type="text"
                    id="voterName"
                    placeholder="กรอกชื่อของคุณ"
                    class="w-full px-4 py-3 border-2 border-blue-300 rounded-lg focus:outline-none focus:border-blue-500 text-lg"
                />
            </div>

            <div class="mb-8">
                <label class="block text-lg font-semibold text-gray-700 mb-2">
                    เลือกผู้เข้าประกวดเพื่อเริ่มให้คะแนน *
                </label>
                <select id="contestantSelect" class="w-full px-4 py-3 border-2 border-blue-300 rounded-lg focus:outline-none focus:border-blue-500 text-lg cursor-pointer">
                    <option value="" disabled selected>-- เลือกผู้เข้าประกวด --</option>
                </select>
            </div>

            <div id="scoringArea" class="hidden border-t-2 border-gray-200 pt-6">
                <div class="flex items-center gap-4 mb-6 p-4 bg-blue-50 rounded-lg border border-blue-200">
                    <div id="contestantIcon" class="w-16 h-16 rounded-full flex items-center justify-center text-white text-2xl font-bold shadow-md"></div>
                    <div>
                        <h3 class="text-3xl font-bold text-gray-800">
                            <span id="currentContestantName" class="text-blue-700"></span>
                        </h3>
                        <p id="currentContestantDept" class="text-base font-semibold text-gray-500"></p>
                    </div>
                </div>
                
                <div id="categoryScoresContainer">
                    </div>
                
                <div class="mt-6 bg-gray-100 rounded-lg p-4 border border-gray-300">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-semibold text-gray-700">ความคืบหน้าคนปัจจุบัน:</span>
                        <span id="progressTextSelected" class="text-blue-600 font-bold">0/4 หัวข้อ</span>
                    </div>
                    <div class="w-full bg-gray-300 rounded-full h-3">
                        <div id="progressBarSelected" class="bg-blue-600 h-3 rounded-full transition-all" style="width: 0%"></div>
                    </div>
                </div>
            </div>

            <div class="mt-8 bg-gray-100 rounded-lg p-4 border border-gray-300">
                <div class="flex justify-between items-center mb-2">
                    <span class="font-semibold text-gray-700">ความคืบหน้ารวม:</span>
                    <span id="progressTextTotal" class="text-blue-600 font-bold">0/36 คะแนน</span>
                </div>
                <div class="w-full bg-gray-300 rounded-full h-3">
                    <div id="progressBarTotal" class="bg-blue-600 h-3 rounded-full transition-all" style="width: 0%"></div>
                </div>
            </div>

            <button
                id="submitBtn"
                class="w-full bg-gray-400 text-white py-4 rounded-xl font-bold text-xl transition-all shadow-lg mt-6 cursor-not-allowed"
                disabled
            >
                📤 ส่งคะแนน (0/36)
            </button>
        </div>

        <div id="successMessage" class="hidden bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center py-12">
                <div class="text-6xl mb-4">✅</div>
                <h2 class="text-3xl font-bold text-green-600 mb-2">
                    ขอบคุณสำหรับการให้คะแนน!
                </h2>
                <p class="text-gray-600 mb-2">คะแนนของคุณถูกบันทึกเรียบร้อยแล้ว</p>
                <p id="voterNameDisplay" class="text-sm text-gray-500 mb-8"></p>
                
                <button
                    id="voteAgainBtn"
                    class="px-8 py-3 bg-gray-500 text-white rounded-lg font-semibold hover:bg-gray-600 transition-all"
                >
                    ให้คะแนนอีกครั้ง
                </button>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config (ใส่ข้อมูลจริงของคุณที่นี่)
        const firebaseConfig = {
            apiKey: "AIzaSyBxQI-sxUkZshLoAq9sZQ5zKm-7NXyytfQ",
            authDomain: "newyear-party-vote.firebaseapp.com",
            databaseURL: "https://newyear-party-vote-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "newyear-party-vote",
            storageBucket: "newyear-party-vote.firebasestorage.app",
            messagingSenderId: "537539574238",
            appId: "1:537539574238:web:b7ed2507d1bcfc3203854f"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Configuration
        const CATEGORIES = [
            { id: 'cat1', name: 'ความเหมือน/เครื่องแต่งกายเข้ากับธีมงาน' },
            { id: 'cat2', name: 'ความคิดสร้างสรรค์' },
            { id: 'cat3', name: 'แรงบันดาลใจ/ที่มาของชุด' },
            { id: 'cat4', name: 'การนำเสนอชุด' }
        ];

        const CONTESTANTS = [
            { id: 'p1', name: 'แมน', dept: 'DC' },
            { id: 'p2', name: 'นิก', dept: 'DC' },
            { id: 'p3', name: 'ดา', dept: 'Retail' },
            { id: 'p4', name: 'บอส', dept: 'PD' },
            { id: 'p5', name: 'เอื้อ', dept: 'PD' },
            { id: 'p6', name: 'ไนซ์', dept: 'MKT' },
            { id: 'p7', name: 'ตาล', dept: 'Import & Export' },
            { id: 'p8', name: 'ไอซ์', dept: 'Import & Export' },
            { id: 'p9', name: 'เฟิร์น', dept: 'HR' }
        ];

        const DEPT_COLORS = {
            'DC': '#3B82F6',
            'Retail': '#10B981',
            'PD': '#F59E0B',
            'MKT': '#EF4444',
            'Import & Export': '#8B5CF6',
            'HR': '#EC4899'
        };

        let scores = {}; // { 'p1': { 'cat1': 0, ... }, ... }
        let currentContestantId = null;

        // --- Initialization and Rendering ---

        function initializeScores() {
            CONTESTANTS.forEach(contestant => {
                scores[contestant.id] = {};
                CATEGORIES.forEach(category => {
                    scores[contestant.id][category.id] = 0;
                });
            });
        }
        
        // ฟังก์ชัน: ตรวจสอบว่าผู้เข้าประกวดคนนี้ให้คะแนนครบ 4 หัวข้อแล้วหรือยัง
        function isContestantComplete(contestantId) {
            return CATEGORIES.every(category => scores[contestantId][category.id] > 0);
        }

        // ฟังก์ชัน: สร้าง Dropdown ใหม่พร้อมสถานะ (✅/🔶)
        function initializeVotingUI() {
            const select = document.getElementById('contestantSelect');
            const selectedValue = select.value; // เก็บค่าที่ถูกเลือกไว้
            select.innerHTML = ''; // ล้าง Dropdown เดิม
            
            // เพิ่ม Option แรกที่เป็น Default
            const defaultOption = document.createElement('option');
            defaultOption.value = "";
            defaultOption.textContent = "-- เลือกผู้เข้าประกวด --";
            defaultOption.disabled = true;
            if (!selectedValue) {
                defaultOption.selected = true;
            }
            select.appendChild(defaultOption);


            // 1. Render Dropdown Options พร้อมสถานะ
            CONTESTANTS.forEach(contestant => {
                const isComplete = isContestantComplete(contestant.id);
                const statusEmoji = isComplete ? '✅' : '🔶';
                
                const option = document.createElement('option');
                option.value = contestant.id;
                option.textContent = `${statusEmoji} ${contestant.name} (${contestant.dept})`;
                
                // หากผู้เข้าประกวดคนเดิมยังถูกเลือกอยู่ ให้ตั้งค่าเป็น Selected
                if (contestant.id === selectedValue) {
                    option.selected = true;
                }
                
                select.appendChild(option);
            });

            // 2. Add event listener for Dropdown change (ป้องกันการเพิ่มซ้ำ)
            if (!select.dataset.listenerAdded) {
                select.addEventListener('change', function() {
                    currentContestantId = this.value;
                    const contestant = CONTESTANTS.find(c => c.id === currentContestantId);
                    
                    // Update Contestant Info
                    document.getElementById('currentContestantName').textContent = contestant.name;
                    document.getElementById('currentContestantDept').textContent = contestant.dept;
                    document.getElementById('contestantIcon').textContent = contestant.name.charAt(0);
                    document.getElementById('contestantIcon').style.backgroundColor = DEPT_COLORS[contestant.dept];
                    document.getElementById('scoringArea').classList.remove('hidden');
                    
                    renderCategoryScores();
                    updateProgress();
                });
                select.dataset.listenerAdded = true;
            }

            // ถ้ามีคนถูกเลือกอยู่แล้ว ให้เรนเดอร์คะแนนของคนนั้นซ้ำ
            if (selectedValue) {
                 currentContestantId = selectedValue;
                 renderCategoryScores();
            }
        }

        // Render the 4 categories for the selected contestant (แก้ไขปัญหาดาวล้น)
        function renderCategoryScores() {
            if (!currentContestantId) return;

            const container = document.getElementById('categoryScoresContainer');
            container.innerHTML = CATEGORIES.map((category, catIdx) => `
                <div class="bg-gray-50 rounded-lg p-4 mb-4 border border-gray-200">
                    <p class="font-semibold text-gray-700 mb-3">${catIdx + 1}. ${category.name}</p>
                    <div id="scoreBtns-${category.id}" class="flex gap-1.5 justify-between">
                        ${[1, 2, 3, 4, 5].map(score => {
                            const isSelected = scores[currentContestantId][category.id] === score;
                            
                            // Base color classes for hover/unselected state
                            let colorClass = '';
                            if (score === 1) colorClass = 'border-red-300 hover:bg-red-100 hover:border-red-500';
                            if (score === 2) colorClass = 'border-orange-300 hover:bg-orange-100 hover:border-orange-500';
                            if (score === 3) colorClass = 'border-yellow-300 hover:bg-yellow-100 hover:border-yellow-500';
                            if (score === 4) colorClass = 'border-lime-300 hover:bg-lime-100 hover:border-lime-500';
                            if (score === 5) colorClass = 'border-green-300 hover:bg-green-100 hover:border-green-500';

                            // Active classes
                            const activeClass = isSelected ? 'ring-4 ring-blue-500 scale-[1.05] ' + (
                                score === 1 ? 'bg-red-100' : 
                                score === 2 ? 'bg-orange-100' : 
                                score === 3 ? 'bg-yellow-100' : 
                                score === 4 ? 'bg-lime-100' : 
                                score === 5 ? 'bg-green-100' : ''
                            ) : '';

                            return `
                                <button
                                    data-category="${category.id}"
                                    data-score="${score}"
                                    class="score-btn flex-1 py-3 px-1 rounded-lg border-2 transition-all text-center font-bold text-sm ${colorClass} ${activeClass}"
                                >
                                    <div class="text-xl mb-1">${score}</div> 
                                    <div class="text-[9px] text-gray-600 leading-none">
                                        ${'⭐'.repeat(score)}
                                    </div>
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>
            `).join('');

            // Attach click handlers to the newly rendered buttons
            document.querySelectorAll('#categoryScoresContainer .score-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const categoryId = this.dataset.category;
                    const score = parseInt(this.dataset.score);
                    selectScore(currentContestantId, categoryId, score, this);
                });
            });
        }

        // --- Core Logic ---

        function selectScore(contestantId, categoryId, score, btnElement) {
            scores[contestantId][categoryId] = score;

            // Update UI: Re-render the current category and update progress/dropdown status
            renderCategoryScores();
            updateProgress();
        }

        function updateProgress() {
            let completedTotal = 0;
            let completedCurrent = 0;
            const totalContestantCategories = CATEGORIES.length;
            const totalOverall = CONTESTANTS.length * CATEGORIES.length;

            CONTESTANTS.forEach(contestant => {
                CATEGORIES.forEach(category => {
                    if (scores[contestant.id][category.id] > 0) {
                        completedTotal++;
                        if (contestant.id === currentContestantId) {
                            completedCurrent++;
                        }
                    }
                });
            });

            // 1. Update Progress Bar for the selected person
            if (currentContestantId) {
                const percentageCurrent = (completedCurrent / totalContestantCategories) * 100;
                document.getElementById('progressBarSelected').style.width = percentageCurrent + '%';
                document.getElementById('progressTextSelected').textContent = `${completedCurrent}/${totalContestantCategories} หัวข้อ`;
            }

            // 2. Update Overall Progress
            const percentageOverall = (completedTotal / totalOverall) * 100;
            document.getElementById('progressBarTotal').style.width = percentageOverall + '%';
            document.getElementById('progressTextTotal').textContent = `${completedTotal}/${totalOverall} คะแนน`;
            
            // 3. Update Submit Button state
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = `📤 ส่งคะแนน (${completedTotal}/${totalOverall})`;
            
            if (completedTotal === totalOverall) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('bg-gray-400', 'cursor-not-allowed');
                submitBtn.classList.add('from-green-600', 'to-green-700', 'hover:from-green-700', 'hover:to-green-800', 'bg-gradient-to-r');
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('bg-gray-400', 'cursor-not-allowed');
                submitBtn.classList.remove('from-green-600', 'to-green-700', 'hover:from-green-700', 'hover:to-green-800', 'bg-gradient-to-r');
            }

            // 4. ***ปรับปรุง Dropdown เพื่อแสดงสถานะล่าสุด***
            initializeVotingUI(); 
        }

        // --- Event Handlers ---

        // Submit Vote
        document.getElementById('submitBtn').addEventListener('click', async function() {
            const voterName = document.getElementById('voterName').value.trim();

            if (!voterName) {
                alert('กรุณากรอกชื่อของคุณ');
                return;
            }

            let allScored = true;
            CONTESTANTS.forEach(contestant => {
                CATEGORIES.forEach(category => {
                    if (scores[contestant.id][category.id] === 0) {
                        allScored = false;
                    }
                });
            });

            if (!allScored) {
                alert('กรุณาให้คะแนนให้ครบทุกคนทุกหัวข้อก่อนส่งคะแนน');
                return;
            }

            this.disabled = true;
            this.textContent = '⏳ กำลังบันทึก...';

            try {
                const voteData = {
                    voterName: voterName,
                    scores: scores,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                };

                // บันทึกไปยัง path 'scores' 
                await database.ref('scores').push(voteData);

                document.getElementById('votingForm').classList.add('hidden');
                document.getElementById('successMessage').classList.remove('hidden');
                document.getElementById('voterNameDisplay').textContent = `ผู้ให้คะแนน: ${voterName}`;

            } catch (error) {
                alert('เกิดข้อผิดพลาด: ' + error.message);
                this.disabled = false;
                this.textContent = `📤 ส่งคะแนน`;
            }
        });

        // Vote Again
        document.getElementById('voteAgainBtn').addEventListener('click', function() {
            initializeScores(); // Reset all scores to 0
            
            document.getElementById('voterName').value = '';
            
            // รีเซ็ต Dropdown state
            document.getElementById('contestantSelect').value = ''; 
            document.getElementById('scoringArea').classList.add('hidden'); 

            document.getElementById('votingForm').classList.remove('hidden');
            document.getElementById('successMessage').classList.add('hidden');
            document.getElementById('submitBtn').disabled = false;
            
            currentContestantId = null; 
            updateProgress(); // จะเรียก initializeVotingUI() เพื่อสร้าง Dropdown ใหม่
        });

        // Run on load
        initializeScores();
        initializeVotingUI();
        updateProgress();
    </script>
</body>
</html>
