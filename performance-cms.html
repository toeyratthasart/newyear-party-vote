<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard ผลคะแนนการแสดง</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-800 via-blue-900 to-cyan-900 min-h-screen p-2 sm:p-4">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="bg-gradient-to-r from-blue-700 to-cyan-700 rounded-2xl shadow-2xl p-4 sm:p-6 mb-4 sm:mb-6 border border-blue-500">
            <div class="flex flex-col sm:flex-row items-center justify-between mb-4 gap-4">
                <div class="text-center sm:text-left">
                    <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-white mb-2">
                        🎪 Varinda's Performance Awards 2025 🏆
                    </h1>
                    <p class="text-sm sm:text-base text-blue-200">แสดงผลแบบเรียลไทม์</p>
                </div>
                <div class="text-center">
                    <div class="bg-white text-blue-700 px-4 sm:px-6 py-2 sm:py-3 rounded-xl font-bold text-xl sm:text-2xl shadow-lg">
                        <span id="totalJudges">0</span> คน
                    </div>
                    <p class="text-blue-200 text-xs sm:text-sm mt-2">จำนวนผู้ให้คะแนน</p>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-between pt-4 border-t border-blue-500 gap-3 sm:gap-4">
                <div class="flex flex-wrap items-center gap-2 sm:gap-4 justify-center sm:justify-start">
                    <button id="refreshBtn" class="flex items-center gap-2 bg-white text-blue-700 px-3 sm:px-4 py-2 rounded-lg hover:bg-blue-50 transition-all font-semibold text-sm sm:text-base">
                        <span>🔄</span> รีเฟรช
                    </button>
                    
                    <label class="flex items-center gap-2 text-white cursor-pointer text-xs sm:text-sm">
                        <input type="checkbox" id="autoRefresh" checked class="w-4 h-4 sm:w-5 sm:h-5" />
                        <span class="hidden sm:inline">รีเฟรชอัตโนมัติ (ทุก 5 วินาที)</span>
                        <span class="sm:hidden">Auto</span>
                    </label>
                </div>

                <div class="flex flex-wrap items-center gap-2 sm:gap-4 justify-center">
                    <button id="exportExcelBtn" class="flex items-center gap-1 sm:gap-2 bg-green-600 text-white px-3 sm:px-4 py-2 rounded-lg hover:bg-green-700 transition-all text-xs sm:text-sm">
                        <span>📊</span> <span class="hidden sm:inline">Export</span>
                    </button>
                    
                    <span id="lastUpdate" class="text-blue-200 text-xs"></span>
                    
                    <button id="resetBtn" class="flex items-center gap-1 sm:gap-2 bg-red-600 text-white px-3 sm:px-4 py-2 rounded-lg hover:bg-red-700 transition-all text-xs sm:text-sm">
                        <span>🗑️</span> <span class="hidden sm:inline">ล้าง</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- No Scores Message -->
        <div id="noScoresMessage" class="hidden bg-slate-800 rounded-2xl shadow-2xl p-8 sm:p-12 text-center border border-slate-700">
            <div class="text-5xl sm:text-6xl mb-4">🎪</div>
            <h2 class="text-xl sm:text-2xl font-bold text-slate-400 mb-2">
                ยังไม่มีคะแนน
            </h2>
            <p class="text-sm sm:text-base text-slate-500">
                รอผู้ให้คะแนนผ่านหน้าโหวต
            </p>
        </div>

        <!-- Results Container -->
        <div id="resultsContainer" class="space-y-4 sm:space-y-6">
            <!-- Overall Ranking -->
            <div class="bg-gradient-to-r from-yellow-500 to-orange-500 rounded-2xl shadow-2xl p-4 sm:p-8 border-4 border-yellow-400">
                <div class="flex items-center justify-center gap-2 sm:gap-3 mb-4 sm:mb-6">
                    <span class="text-3xl sm:text-5xl">🏆</span>
                    <h2 class="text-xl sm:text-2xl md:text-3xl font-bold text-yellow-900">
                        อันดับคะแนนรวม
                    </h2>
                </div>
                <div id="overallRanking" class="grid grid-cols-1 sm:grid-cols-3 gap-3 sm:gap-6"></div>
            </div>

            <!-- Category Scores -->
            <div id="categoryScores"></div>

            <!-- Detailed Table -->
            <div class="bg-slate-800 rounded-2xl shadow-2xl p-4 sm:p-8 border border-slate-700">
                <h3 class="text-lg sm:text-2xl font-bold text-white mb-4 sm:mb-6">📋 ตารางคะแนนรายละเอียด</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-white text-xs sm:text-base">
                        <thead class="bg-slate-700">
                            <tr>
                                <th class="p-2 sm:p-3 text-left">อันดับ</th>
                                <th class="p-2 sm:p-3 text-left">ชื่อทีม</th>
                                <th class="p-2 sm:p-3 text-left hidden md:table-cell">สมาชิก</th>
                                <th class="p-2 sm:p-3 text-center">1</th>
                                <th class="p-2 sm:p-3 text-center">2</th>
                                <th class="p-2 sm:p-3 text-center">3</th>
                                <th class="p-2 sm:p-3 text-center font-bold">รวม</th>
                            </tr>
                        </thead>
                        <tbody id="detailedTable"></tbody>
                    </table>
                </div>
            </div>

            <!-- Judges List -->
            <div class="bg-slate-800 rounded-2xl shadow-2xl p-4 sm:p-8 border border-slate-700">
                <h3 class="text-lg sm:text-2xl font-bold text-white mb-4 flex items-center gap-2">
                    <span>👥</span>
                    <span>รายชื่อผู้ให้คะแนน (<span id="judgeCount">0</span> คน)</span>
                </h3>
                <div id="judgesList" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-2 sm:gap-3 max-h-64 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
  apiKey: "AIzaSyBxQI-sxUkZshLoAq9sZQ5zKm-7NXyytfQ",
  authDomain: "newyear-party-vote.firebaseapp.com",
  databaseURL: "https://newyear-party-vote-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "newyear-party-vote",
  storageBucket: "newyear-party-vote.firebasestorage.app",
  messagingSenderId: "537539574238",
  appId: "1:537539574238:web:b7ed2507d1bcfc3203854f"
};

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Configuration
        const CATEGORIES = [
            { id: 'cat1', name: 'ความสวยงาม ความพร้อมเพรียง', short: 'สวยงาม' },
            { id: 'cat2', name: 'ลีลา และความต่อเนื่องในการแสดง', short: 'ลีลา' },
            { id: 'cat3', name: 'ความคิดริเริ่มสร้างสรรค์', short: 'สร้างสรรค์' }
        ];

        const TEAMS = [
            { 
                id: 't1', 
                name: 'ลูกหวัง แม่ก็หวัง', 
                members: ['ที', 'อ้น', 'นัท', 'ปูเป้', 'ข้าวโพด', 'ซัน', 'ส้ม', 'เปรียว', 'เฟิร์น', 'เป้', 'บอล', 'จูน'],
                color: '#8B5CF6'
            },
            { 
                id: 't2', 
                name: 'Varinda Distribution Center', 
                members: ['ตั้ง', 'ไอซ์', 'ดิว', 'วี', 'บังหรัง', 'บอส', 'นิก'],
                color: '#3B82F6'
            },
            { 
                id: 't3', 
                name: 'ECOM', 
                members: ['ทอดมัน', 'ตูน', 'มอส', 'แพรว', 'โซดา', 'ดา'],
                color: '#10B981'
            },
            { 
                id: 't4', 
                name: 'ชิงร้อยชิงล้าน', 
                members: ['สีน้ำ', 'ฝ้าย', 'เอื้อ', 'อิ้ง', 'ติ๊ด', 'แก้ม', 'อิ๋ว', 'บอส', 'หนิง', 'แพรว'],
                color: '#F59E0B'
            },
            { 
                id: 't5', 
                name: 'TYP ENTERTAINMENT', 
                members: ['บิว', 'ลิ้ม', 'ฟิ่ว', 'เต้ย', 'น็อต', 'แซม', 'ไนซ์', 'กัน', 'ตาล', 'เบล', 'พลอย'],
                color: '#EF4444'
            }
        ];

        let allScores = [];
        let charts = {};

        // Listen to Firebase changes
        database.ref('performances').on('value', (snapshot) => {
            const data = snapshot.val();
            allScores = data ? Object.values(data) : [];
            updateDashboard();
        });

        function calculateResults() {
            const results = {};
            
            TEAMS.forEach(team => {
                results[team.id] = {
                    name: team.name,
                    members: team.members,
                    color: team.color,
                    categoryScores: {},
                    categoryAvg: {},
                    totalScore: 0,
                    totalAvg: 0
                };
                
                CATEGORIES.forEach(category => {
                    results[team.id].categoryScores[category.id] = [];
                    results[team.id].categoryAvg[category.id] = 0;
                });
            });

            // Collect all scores
            allScores.forEach(scoreData => {
                TEAMS.forEach(team => {
                    CATEGORIES.forEach(category => {
                        const score = scoreData.scores[team.id][category.id];
                        results[team.id].categoryScores[category.id].push(score);
                    });
                });
            });

            // Calculate averages
            TEAMS.forEach(team => {
                let totalSum = 0;
                CATEGORIES.forEach(category => {
                    const scores = results[team.id].categoryScores[category.id];
                    const avg = scores.length > 0 
                        ? scores.reduce((a, b) => a + b, 0) / scores.length 
                        : 0;
                    results[team.id].categoryAvg[category.id] = avg;
                    totalSum += avg;
                });
                results[team.id].totalAvg = totalSum;
            });

            return results;
        }

        function updateDashboard() {
            const totalJudges = allScores.length;
            document.getElementById('totalJudges').textContent = totalJudges;
            document.getElementById('judgeCount').textContent = totalJudges;
            document.getElementById('lastUpdate').textContent = `${new Date().toLocaleTimeString('th-TH', { 
                hour: '2-digit', 
                minute: '2-digit',
                timeZone: 'Asia/Bangkok'
            })}`;

            if (totalJudges === 0) {
                document.getElementById('noScoresMessage').classList.remove('hidden');
                document.getElementById('resultsContainer').classList.add('hidden');
                return;
            }

            document.getElementById('noScoresMessage').classList.add('hidden');
            document.getElementById('resultsContainer').classList.remove('hidden');

            updateOverallRanking();
            updateCategoryScores();
            updateDetailedTable();
            updateJudgesList();
        }

        function updateOverallRanking() {
            const results = calculateResults();
            const ranking = Object.values(results)
                .sort((a, b) => b.totalAvg - a.totalAvg);

            const html = ranking.slice(0, 3).map((team, idx) => {
                const medals = ['🥇', '🥈', '🥉'];
                const bgColors = ['bg-yellow-100', 'bg-gray-100', 'bg-orange-100'];
                
                return `
                    <div class="${bgColors[idx]} rounded-xl p-4 sm:p-6 ${idx === 0 ? 'ring-4 ring-yellow-700 transform scale-105' : 'shadow-lg'}">
                        <div class="text-center mb-2 sm:mb-3">
                            <span class="text-3xl sm:text-5xl">${medals[idx]}</span>
                            <p class="font-bold text-gray-800 text-xs sm:text-sm mt-2">อันดับ ${idx + 1}</p>
                        </div>
                        <div 
                            class="w-14 h-14 sm:w-20 sm:h-20 rounded-full mx-auto mb-2 sm:mb-3 flex items-center justify-center text-white font-bold text-xl sm:text-3xl shadow-lg"
                            style="background-color: ${team.color}"
                        >
                            ${idx + 1}
                        </div>
                        <p class="font-bold text-gray-800 text-base sm:text-xl text-center mb-2">${team.name}</p>
                        <p class="text-xs text-gray-600 text-center mb-2 sm:mb-3 line-clamp-2">
                            ${team.members.slice(0, 5).join(', ')}${team.members.length > 5 ? '...' : ''}
                        </p>
                        <p class="text-2xl sm:text-4xl font-bold text-blue-600 text-center">${team.totalAvg.toFixed(2)}</p>
                        <p class="text-xs sm:text-sm text-gray-600 text-center">คะแนนเฉลี่ย</p>
                    </div>
                `;
            }).join('');
            
            document.getElementById('overallRanking').innerHTML = html;
        }

        function updateCategoryScores() {
            const results = calculateResults();
            const container = document.getElementById('categoryScores');
            
            container.innerHTML = CATEGORIES.map(category => {
                const chartData = TEAMS.map(team => ({
                    name: results[team.id].name,
                    score: results[team.id].categoryAvg[category.id],
                    color: team.color
                })).sort((a, b) => b.score - a.score);

                const winner = chartData[0];
                
                return `
                    <div class="bg-slate-800 rounded-2xl shadow-2xl p-4 sm:p-8 border border-slate-700">
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between mb-4 sm:mb-6 gap-3 sm:gap-4">
                            <h3 class="text-base sm:text-xl md:text-2xl font-bold text-white">
                                🎯 ${category.name}
                            </h3>
                            <div class="text-left sm:text-right">
                                <p class="text-slate-400 text-xs sm:text-sm">ผู้นำ:</p>
                                <p class="text-base sm:text-xl font-bold text-yellow-400">${winner.name}</p>
                                <p class="text-lg sm:text-2xl font-bold text-white">${winner.score.toFixed(2)}</p>
                            </div>
                        </div>
                        <canvas id="chart-${category.id}" class="max-h-48 sm:max-h-none"></canvas>
                    </div>
                `;
            }).join('');

            // Create charts
            CATEGORIES.forEach(category => {
                const results = calculateResults();
                const chartData = TEAMS.map(team => 
                    results[team.id].categoryAvg[category.id]
                );
                
                const ctx = document.getElementById(`chart-${category.id}`).getContext('2d');
                
                if (charts[category.id]) {
                    charts[category.id].destroy();
                }
                
                charts[category.id] = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: TEAMS.map(t => t.name),
                        datasets: [{
                            label: 'คะแนนเฉลี่ย',
                            data: chartData,
                            backgroundColor: TEAMS.map(t => t.color),
                            borderRadius: 8,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { display: false },
                            tooltip: {
                                backgroundColor: '#1e293b',
                                callbacks: {
                                    label: function(context) {
                                        return 'คะแนนเฉลี่ย: ' + context.parsed.y.toFixed(2);
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                max: 5,
                                ticks: { 
                                    color: '#94a3b8',
                                    stepSize: 1,
                                    font: { size: window.innerWidth < 640 ? 10 : 12 }
                                },
                                grid: { color: '#475569' }
                            },
                            x: {
                                ticks: { 
                                    color: '#94a3b8',
                                    font: { 
                                        weight: 'bold', 
                                        size: window.innerWidth < 640 ? 8 : 10 
                                    }
                                },
                                grid: { display: false }
                            }
                        }
                    }
                });
            });
        }

        function updateDetailedTable() {
            const results = calculateResults();
            const ranking = Object.values(results)
                .sort((a, b) => b.totalAvg - a.totalAvg);

            const html = ranking.map((team, idx) => `
                <tr class="border-b border-slate-700 hover:bg-slate-700">
                    <td class="p-2 sm:p-3 font-bold text-base sm:text-xl">${idx + 1}</td>
                    <td class="p-2 sm:p-3">
                        <div class="font-bold text-sm sm:text-lg">${team.name}</div>
                        <div class="text-xs hidden sm:block" style="color: ${team.color}">${team.members.length} คน</div>
                    </td>
                    <td class="p-2 sm:p-3 text-xs sm:text-sm text-gray-300 hidden md:table-cell">
                        ${team.members.join(', ')}
                    </td>
                    ${CATEGORIES.map(cat => `
                        <td class="p-2 sm:p-3 text-center text-sm sm:text-lg">${team.categoryAvg[cat.id].toFixed(2)}</td>
                    `).join('')}
                    <td class="p-2 sm:p-3 text-center font-bold text-yellow-400 text-lg sm:text-2xl">
                        ${team.totalAvg.toFixed(2)}
                    </td>
                </tr>
            `).join('');
            
            document.getElementById('detailedTable').innerHTML = html;
        }

        function updateJudgesList() {
            const html = allScores.map((score) => {
                const time = score.timestamp ? new Date(score.timestamp).toLocaleTimeString('th-TH', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    timeZone: 'Asia/Bangkok'
                }) : 'N/A';
                return `
                    <div class="bg-slate-700 rounded-lg p-2 sm:p-3 text-center border border-slate-600">
                        <p class="text-white font-semibold text-xs sm:text-sm truncate">${score.voterName}</p>
                        <p class="text-slate-400 text-xs mt-1">${time}</p>
                    </div>
                `;
            }).join('');
            document.getElementById('judgesList').innerHTML = html;
        }

        // Export to Excel
        function exportToExcel() {
            if (allScores.length === 0) {
                alert('ยังไม่มีข้อมูลให้ Export');
                return;
            }

            const results = calculateResults();
            const ranking = Object.values(results).sort((a, b) => b.totalAvg - a.totalAvg);

            let csv = '\uFEFF';
            csv += 'อันดับ,ชื่อทีม,สมาชิก';
            CATEGORIES.forEach(cat => csv += ',' + cat.short);
            csv += ',คะแนนรวม\n';

            ranking.forEach((team, idx) => {
                csv += `${idx + 1},"${team.name}","${team.members.join(', ')}"`;
                CATEGORIES.forEach(cat => {
                    csv += ',' + team.categoryAvg[cat.id].toFixed(2);
                });
                csv += ',' + team.totalAvg.toFixed(2) + '\n';
            });

            csv += '\n\n=== รายละเอียดคะแนนแต่ละทีม ===\n';
            allScores.forEach((scoreData, idx) => {
                const time = scoreData.timestamp ? new Date(scoreData.timestamp).toLocaleString('th-TH', {
                    timeZone: 'Asia/Bangkok'
                }) : 'N/A';
                csv += `\nผู้ให้คะแนนคนที่ ${idx + 1}: ${scoreData.voterName} (${time})\n`;
                csv += 'ทีม';
                CATEGORIES.forEach(cat => csv += ',' + cat.short);
                csv += '\n';
                
                TEAMS.forEach(team => {
                    csv += `"${team.name}"`;
                    CATEGORIES.forEach(cat => {
                        csv += ',' + scoreData.scores[team.id][cat.id];
                    });
                    csv += '\n';
                });
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `performance-scores-${new Date().toISOString().slice(0,10)}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.getElementById('exportExcelBtn').addEventListener('click', exportToExcel);

        // Auto refresh
        let autoRefreshInterval;
        document.getElementById('autoRefresh').addEventListener('change', function() {
            if (this.checked) {
                autoRefreshInterval = setInterval(() => {
                    document.getElementById('lastUpdate').textContent = `${new Date().toLocaleTimeString('th-TH', {
                        hour: '2-digit',
                        minute: '2-digit',
                        timeZone: 'Asia/Bangkok'
                    })}`;
                }, 5000);
            } else {
                clearInterval(autoRefreshInterval);
            }
        });

        document.getElementById('refreshBtn').addEventListener('click', () => {
            updateDashboard();
        });

        document.getElementById('resetBtn').addEventListener('click', async () => {
            if (confirm('⚠️ คุณแน่ใจหรือไม่ว่าต้องการล้างคะแนนทั้งหมด?\n\nการกระทำนี้ไม่สามารถย้อนกลับได้!')) {
                try {
                    await database.ref('performances').remove();
                    alert('✅ ล้างคะแนนเรียบร้อยแล้ว');
                } catch (error) {
                    alert('❌ เกิดข้อผิดพลาด: ' + error.message);
                }
            }
        });

        // Start auto refresh
        autoRefreshInterval = setInterval(() => {
            document.getElementById('lastUpdate').textContent = `${new Date().toLocaleTimeString('th-TH', {
                hour: '2-digit',
                minute: '2-digit',
                timeZone: 'Asia/Bangkok'
            })}`;
        }, 5000);
    </script>
</body>
</html>
